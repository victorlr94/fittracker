# CI de FitTracker: dos jobs independientes, uno por lenguaje.
# Ver docs/02-roadmap.md (Fase 0) y CLAUDE.md § Comandos.
name: CI

on:
  push:
    branches: [main, "fase-*"]
  pull_request:
    branches: [main]

jobs:
  flutter:
    name: Flutter — analyze, test, build APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    # GitHub Actions no permite usar el contexto `secrets` directamente
    # dentro de un `if:` de step ("Unrecognized named-value: 'secrets'").
    # El workaround documentado es exponerlo primero como variable de
    # entorno a nivel de job y condicionar sobre `env` en su lugar.
    env:
      HAS_SIGNING_SECRET: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Generar código (Drift, Riverpod)
        # Los .g.dart no se versionan (ver .gitignore) — se generan aquí,
        # igual que en desarrollo local (CLAUDE.md § Comandos).
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analizar
        run: flutter analyze

      - name: Pruebas
        run: flutter test

      - name: Preparar firma de release
        # Sin estos secretos (p. ej. en un fork, o antes de configurarlos
        # la primera vez) simplemente no se crea key.properties, y
        # android/app/build.gradle.kts cae a la firma de debug — el build
        # no falla, solo produce un APK sin firma de release
        # (docs/00-decisiones.md ADR-007).
        if: ${{ env.HAS_SIGNING_SECRET == 'true' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/fittracker-upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=${{ github.workspace }}/app/android/fittracker-upload-keystore.jks
          EOF

      - name: Compilar APK (release, por arquitectura)
        run: flutter build apk --release --split-per-abi

      - name: Publicar APKs como artifact
        uses: actions/upload-artifact@v7
        with:
          name: fittracker-apks-${{ github.sha }}
          path: app/build/app/outputs/flutter-apk/*.apk
          retention-days: 30
          if-no-files-found: error

  python:
    name: Python (tools/) — ruff, mypy, pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Instalar dependencias
        run: uv sync

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (formato)
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy src/

      - name: Pruebas
        run: uv run pytest -q
