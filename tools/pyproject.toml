[project]
name = "fittracker-data"
version = "0.1.0"
description = "Ingesta y análisis de datos externos para FitTracker (ver docs/03-ingesta-de-datos.md)"
readme = "README.md"
authors = [
    { name = "Victor Manuel Lugo Ramirez", email = "victorlr9412@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.5.0",
    "pydantic>=2.13.5",
]

[project.scripts]
fittracker-data = "fittracker_data.build_all:main"

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=8.3",
    "ruff>=0.9",
]

[build-system]
requires = ["uv_build>=0.11.23,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
exclude = ["^analysis/"]

# Estricto en el paquete reutilizable de ingesta.
[[tool.mypy.overrides]]
module = "fittracker_data.*"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
