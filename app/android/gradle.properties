org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# El compilador incremental de Kotlin (Build Tools API) falla de forma
# reproducible en este entorno Windows al cerrar sus cachés mmap
# (PersistentHashMap, "Could not close incremental caches") al compilar
# módulos de plugins como file_picker. Es un problema conocido de Kotlin +
# mmap en Windows, no del código de la app. Desactivar el incremental es
# el workaround: los builds tardan un poco más, pero no fallan.
kotlin.incremental=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
